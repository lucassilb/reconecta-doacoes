services:
  - type: web
    name: reconecta
    runtime: docker
    plan: free
    autoDeployTrigger: checksPass
    healthCheckPath: /reconecta/saude
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SEGURO
        value: "1"
      - key: ADMIN_TOKEN
        sync: false
