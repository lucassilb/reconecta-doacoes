name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q --junitxml=pytest.xml
        env:
          DATABASE_URL: sqlite://
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: pytest-junit
          path: pytest.xml
          if-no-files-found: warn

  ia:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Treinar, avaliar e conferir limiares
        run: python scripts/ciclo_ia.py
        env:
          DATABASE_URL: sqlite://
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: metricas-ia
          path: |
            modelo/metricas.json
            modelo/avaliacao_conexao.json
          if-no-files-found: error

  sast-bandit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Relatorios JSON e texto
        run: |
          mkdir -p reports
          bandit -r . -x ./tests,./scripts,./.venv,./venv,./instance,./relatorios,./__pycache__ -f json -o reports/bandit.json || true
          bandit -r . -x ./tests,./scripts,./.venv,./venv,./instance,./relatorios,./__pycache__ -f txt -o reports/bandit.txt || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: bandit-report
          path: reports/bandit.*
          if-no-files-found: warn
      - name: "Gate: bloquear achados de severidade alta (Bandit -lll)"
        run: bandit -r . -x ./tests,./scripts,./.venv,./venv,./instance,./relatorios,./__pycache__ -lll

  sast-trivy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: mkdir -p reports
      - name: Construir imagem para varredura
        run: docker build -t reconecta:ci .
      - name: Arquivos, dependencias, segredos e configuracao (tabela)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          skip-dirs: .git,__pycache__,instance,relatorios,tests/fixtures,.venv,venv
          format: table
          output: reports/trivy-fs.txt
          exit-code: "0"
      - name: Arquivos (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          skip-dirs: .git,__pycache__,instance,relatorios,tests/fixtures,.venv,venv
          format: sarif
          output: reports/trivy-fs.sarif
          exit-code: "0"
      - name: Arquivos (JSON para resumo)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          skip-dirs: .git,__pycache__,instance,relatorios,tests/fixtures,.venv,venv
          format: json
          output: reports/trivy-fs.json
          exit-code: "0"
      - name: Configuração (JSON para resumo)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: json
          output: reports/trivy-config.json
          exit-code: "0"
      - name: Imagem (tabela)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: reconecta:ci
          scanners: vuln,secret,misconfig
          format: table
          output: reports/trivy-image.txt
          exit-code: "0"
      - name: Imagem (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: reconecta:ci
          scanners: vuln,secret,misconfig
          format: sarif
          output: reports/trivy-image.sarif
          exit-code: "0"
      - name: Imagem (JSON para resumo)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: reconecta:ci
          scanners: vuln,secret,misconfig
          format: json
          output: reports/trivy-image.json
          exit-code: "0"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: trivy-report
          path: reports/trivy-*
          if-no-files-found: warn
      - name: "Gate: bloquear alta/critica corrigivel nos arquivos"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          skip-dirs: .git,__pycache__,instance,relatorios,tests/fixtures,.venv,venv
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: "Gate: bloquear alta/critica na configuracao (IaC)"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: "Gate: bloquear alta ou critica na imagem"
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: reconecta:ci
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"

  sast-semgrep:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install semgrep
      - name: Relatorio completo (p/python, flask, secrets, owasp)
        run: |
          mkdir -p reports
          semgrep --config p/python --config p/flask --config p/secrets --config p/owasp-top-ten \
            --json -o reports/semgrep.json --exclude tests --exclude .venv . || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: semgrep-report
          path: reports/semgrep.json
          if-no-files-found: warn
      - name: "Gate: regras locais (ERROR falha)"
        run: semgrep --config semgrep-local.yml --error --quiet .
      - name: "Gate: severidade ERROR nos pacotes oficiais"
        run: |
          semgrep --config p/python --config p/flask --config p/secrets --config p/owasp-top-ten \
            --severity ERROR --error --quiet --exclude tests --exclude .venv .

  sca-pip-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install pip-audit cyclonedx-bom
      - name: Relatorio + SBOM
        run: |
          mkdir -p reports
          pip-audit -r requirements.txt -r requirements-dev.txt -f json -o reports/pip-audit.json || true
          cat requirements.txt requirements-dev.txt > /tmp/reqs.txt
          cyclonedx-py requirements /tmp/reqs.txt -o reports/sbom-cyclonedx.json --of JSON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sca-report
          path: reports/
          if-no-files-found: warn
      - name: "Gate: nenhuma CVE nas dependencias"
        run: pip-audit -r requirements.txt -r requirements-dev.txt --strict

  segredos-gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Instalar gitleaks
        run: |
          curl -sL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
      - name: Relatorio (arquivos + historico)
        run: |
          mkdir -p reports
          gitleaks dir . -r reports/gitleaks-dir.json --exit-code 0
          gitleaks git . -r reports/gitleaks-git.json --exit-code 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: gitleaks-report
          path: reports/
          if-no-files-found: warn
      - name: "Gate: nenhum segredo nos arquivos atuais"
        run: gitleaks dir . --exit-code 1

  guardas:
    name: "Enquanto coda (pre-commit)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Ferramentas de sistema dos hooks
        run: |
          pip install pre-commit semgrep pip-audit
          curl -sL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
      - name: "Gate: mesmos hooks do commit local, em todos os arquivos"
        run: pre-commit run --all-files

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Construir e subir Compose
        run: |
          docker compose build app
          docker compose up -d --wait
      - name: Verificar saude
        run: curl --fail --silent --show-error http://localhost:5000/reconecta/saude
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs --no-color
      - name: Encerrar Compose
        if: always()
        run: docker compose down -v

  sast-resumo:
    needs: [sast-bandit, sast-trivy, sast-semgrep, sca-pip-audit, segredos-gitleaks]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bandit-report
          path: relatorios/sast
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: trivy-report
          path: relatorios/sast
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: semgrep-report
          path: relatorios/seguranca
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sca-report
          path: relatorios/seguranca
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gitleaks-report
          path: relatorios/seguranca
      - name: Resumir varreduras e STRIDE
        run: python scripts/resumo_sast.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sast-resumo
          path: relatorios/sast/resumo.json

  iast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Suíte instrumentada com SQLite temporário
        run: |
          mkdir -p reports/iast
          python -m pytest -q
        env:
          DATABASE_URL: sqlite://
          GROQ_API_KEY: ""
          RECONECTA_IAST: "1"
          RECONECTA_IAST_REPORT_DIR: reports/iast
      - name: Gate BOLA/IDOR por objeto com seis contas fictícias
        run: python scripts/avaliar_autorizacao.py
      - name: Resumir e bloquear achados altos
        if: always()
        run: python scripts/resumo_iast.py reports/iast
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: iast-report
          path: |
            relatorios/seguranca/iast.json
            relatorios/seguranca/autorizacao.json
          if-no-files-found: warn

  dast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: ZAP baseline e API com sessões fictícias no Compose local
        run: python scripts/dast.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dast-iast-report
          path: |
            relatorios/seguranca/zap.json
            relatorios/seguranca/iast-dast.json
          if-no-files-found: warn

  guardrails:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-guardrails.txt pytest==9.0.3
      - name: "Gate: guardas da IA executadas pelo NeMo Guardrails e log mínimo sem dado pessoal"
        run: python -m pytest -q tests/test_guardrails_ia.py tests/test_log_minimo.py
        env:
          DATABASE_URL: sqlite://
          RECONECTA_NEMO: "1"
      - name: Relatórios (corpus de ataques no NeMo e fluxo completo de logs)
        if: always()
        run: |
          python scripts/relatorio_guardrails.py
          python scripts/relatorio_log_minimo.py
        env:
          DATABASE_URL: sqlite://
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: guardrails-log-minimo
          path: |
            relatorios/seguranca/nemo-guardrails.json
            relatorios/seguranca/log-minimo.json
          if-no-files-found: warn

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    needs: [testes, ia, sast-bandit, sast-trivy, sast-semgrep, sca-pip-audit, segredos-gitleaks, guardas, sast-resumo, docker, dast, iast, guardrails]
    runs-on: ubuntu-24.04
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Disparar Render quando configurado
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL ausente; deploy ignorado."
            exit 0
          fi
          curl --fail --silent --show-error --output /dev/null --request POST "$RENDER_DEPLOY_HOOK_URL"
