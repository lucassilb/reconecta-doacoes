<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alimento doado · ReConecta</title>
  <meta name="description" content="Alimento doado por uma empresa ou pessoa. Uma ONG reserva pelo site e retira no prazo.">
  <meta name="color-scheme" content="light">
  <link rel="icon" type="image/svg+xml" href="/static/img/marca.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/excedente.css">
  <script src="/static/js/layout.js" defer></script>
  <script src="/static/js/excedente.js" defer></script>
</head>
<body class="excedente-pagina">
  <header data-layout="cabecalho"></header>

  <main id="conteudo" class="container exc-pagina">
    <a class="exc-voltar" href="/#excedentes">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 12H5M11 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Alimentos doados
    </a>

    <div id="exc-carregando" class="exc-carregando" role="status">Carregando…</div>
    <div id="exc-erro" class="aviso aviso--erro" role="alert" hidden></div>

    <div id="exc" class="exc" hidden>
      <!-- ===== os dados ===== -->
      <article class="exc-dados" aria-labelledby="exc-titulo">
        <img class="exc-dados__foto" id="exc-foto" src="/static/img/doacoes/cat-outros.webp" alt="" width="640" height="480">
        <p class="exc-dados__selo" id="exc-sua" hidden>Sua doação</p>
        <div class="exc-dados__corpo">
          <p class="exc-dados__tipo">Alimento doado</p>
          <h1 id="exc-titulo"></h1>
          <p class="exc-dados__quem" id="exc-quem"></p>
          <p class="exc-estado" id="exc-situacao" role="status" aria-live="polite"></p>
          <dl class="exc-fatos">
            <div><dt>Retirar até</dt><dd><span id="exc-prazo"></span> <span class="exc-falta" id="exc-falta"></span></dd></div>
            <div><dt>Validade</dt><dd id="exc-validade"></dd></div>
            <div class="exc-fatos__largo"><dt>Onde retirar</dt><dd id="exc-local"></dd></div>
            <div class="exc-fatos__largo" id="exc-obs-linha" hidden><dt>Observação</dt><dd id="exc-obs"></dd></div>
          </dl>
          <!-- foto da validade: a API só manda foto_url para quem publicou e para ONG logada -->
          <figure class="exc-validade" id="exc-validade-foto" hidden>
            <a id="exc-validade-link" href="#" target="_blank" rel="noopener">
              <img id="exc-validade-img" alt="Foto do alimento mostrando a validade" width="640" height="480">
            </a>
            <figcaption id="exc-validade-legenda"></figcaption>
          </figure>
          <ul class="exc-itens" id="exc-itens" aria-label="Itens desta doação"></ul>
        </div>
      </article>

      <!-- ===== a ação de quem está vendo ===== -->
      <section class="exc-acao-cartao" aria-labelledby="acao-titulo">
        <h2 id="acao-titulo" tabindex="-1">Reservar</h2>
        <div id="exc-acao" class="exc-acao"></div>
        <div id="exc-aviso" class="exc-aviso" role="alert" hidden></div>
      </section>
    </div>
  </main>

  <footer data-layout="rodape"></footer>
</body>
</html>
