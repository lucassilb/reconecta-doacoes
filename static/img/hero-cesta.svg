<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="t">
  <title id="t">Caixa de alimentos doados vista de cima: verduras, tomates, laranjas, pães, cenouras, bananas e um saco de arroz</title>
  <defs>
    <radialGradient id="prato" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#ECEEF4"/>
    </radialGradient>
    <linearGradient id="madeira" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D7A86E"/>
      <stop offset="1" stop-color="#B98448"/>
    </linearGradient>
    <radialGradient id="tomate" cx="38%" cy="35%" r="70%">
      <stop offset="0" stop-color="#F2765A"/>
      <stop offset="1" stop-color="#C9361F"/>
    </radialGradient>
    <radialGradient id="laranja" cx="38%" cy="35%" r="70%">
      <stop offset="0" stop-color="#FFB758"/>
      <stop offset="1" stop-color="#E5801D"/>
    </radialGradient>
    <radialGradient id="pao" cx="45%" cy="40%" r="65%">
      <stop offset="0" stop-color="#E9B46F"/>
      <stop offset="1" stop-color="#B9772F"/>
    </radialGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1B1D22" flood-opacity=".16"/>
    </filter>
    <filter id="sombra-p" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#2A1A08" flood-opacity=".28"/>
    </filter>
    <clipPath id="interior"><rect x="168" y="168" width="304" height="304" rx="18"/></clipPath>
  </defs>

  <!-- folhas que saem da borda (atrás do prato) -->
  <g fill="#6DAE45">
    <path d="M478 112c38-52 104-66 140-56-6 44-52 96-120 104z"/>
    <path d="M500 150c46-20 98-6 120 22-30 26-84 34-128 6z" fill="#5A9A38"/>
    <path d="M150 548c-44 30-104 28-132 6 22-36 82-58 138-38z" fill="#5A9A38"/>
    <path d="M96 470c-44-28-64-84-50-118 40 6 82 52 78 106z"/>
  </g>
  <g fill="none" stroke="#467A2A" stroke-width="3" stroke-linecap="round">
    <path d="M492 150c36-30 74-50 116-86"/>
    <path d="M504 164c36-6 72 0 106 8"/>
    <path d="M150 530c-38 4-80 10-120 22"/>
    <path d="M114 464c-24-30-42-62-58-100"/>
  </g>

  <!-- prato -->
  <circle cx="320" cy="320" r="282" fill="url(#prato)" filter="url(#sombra)"/>
  <circle cx="320" cy="320" r="246" fill="none" stroke="#DCDFE8" stroke-width="2"/>

  <!-- caixa de madeira -->
  <g filter="url(#sombra)">
    <rect x="146" y="146" width="348" height="348" rx="28" fill="url(#madeira)"/>
  </g>
  <rect x="168" y="168" width="304" height="304" rx="18" fill="#7E5428"/>
  <g stroke="#A8743C" stroke-width="2" opacity=".7">
    <path d="M158 236h10M158 320h10M158 404h10M472 236h10M472 320h10M472 404h10"/>
    <path d="M236 158v10M320 158v10M404 158v10M236 472v10M320 472v10M404 472v10"/>
  </g>
  <g fill="#8C5D2C" opacity=".55">
    <circle cx="160" cy="160" r="4"/><circle cx="480" cy="160" r="4"/><circle cx="160" cy="480" r="4"/><circle cx="480" cy="480" r="4"/>
  </g>

  <g clip-path="url(#interior)">
    <!-- papel kraft forrando -->
    <path d="M168 168h304v304H168z" fill="#9A6A36"/>
    <path d="M168 300l120-132h60L168 380z" fill="#A87A44" opacity=".6"/>

    <!-- verduras (canto superior esquerdo) -->
    <g filter="url(#sombra-p)">
      <circle cx="220" cy="218" r="62" fill="#6FA544"/>
      <circle cx="262" cy="196" r="44" fill="#86BD52"/>
      <circle cx="196" cy="262" r="42" fill="#7DB04A"/>
      <circle cx="240" cy="240" r="34" fill="#A4D06A"/>
    </g>
    <g fill="none" stroke="#557F2E" stroke-width="2.4" stroke-linecap="round" opacity=".8">
      <path d="M240 240c-20-14-36-30-52-52M240 240c8-22 12-40 22-58M240 240c-18 6-36 12-58 26"/>
      <path d="M226 210c-6 6-14 8-22 6M252 222c8-6 14-12 16-22M214 248c-8-2-14 2-20 8"/>
    </g>

    <!-- saco de arroz (canto superior direito) -->
    <g filter="url(#sombra-p)" transform="rotate(10 410 226)">
      <rect x="350" y="176" width="116" height="104" rx="20" fill="#EFE5CF"/>
      <path d="M350 200c18-14 98-14 116 0" fill="none" stroke="#D2C2A0" stroke-width="3"/>
      <rect x="374" y="212" width="68" height="34" rx="8" fill="#6DAE45"/>
      <path d="M386 229h44" stroke="#EFE5CF" stroke-width="4" stroke-linecap="round"/>
      <g fill="#FFFDF6"><ellipse cx="372" cy="266" rx="4" ry="2.2"/><ellipse cx="386" cy="262" rx="4" ry="2.2"/><ellipse cx="444" cy="264" rx="4" ry="2.2"/><ellipse cx="430" cy="268" rx="4" ry="2.2"/></g>
    </g>

    <!-- bananas -->
    <g filter="url(#sombra-p)">
      <path d="M300 300c40 40 108 42 150 4-30 18-92 18-136-14z" fill="#F2CF4A"/>
      <path d="M296 286c46 34 112 30 148-12-34 22-94 26-138-8z" fill="#E8C13A"/>
      <path d="M296 272c50 28 110 20 140-26-30 26-88 34-132 12z" fill="#F5D65C"/>
      <rect x="284" y="272" width="22" height="30" rx="6" fill="#7A5A1E" transform="rotate(-30 295 287)"/>
    </g>

    <!-- tomates -->
    <g filter="url(#sombra-p)">
      <circle cx="356" cy="380" r="36" fill="url(#tomate)"/>
      <circle cx="420" cy="410" r="32" fill="url(#tomate)"/>
      <circle cx="404" cy="348" r="28" fill="url(#tomate)"/>
    </g>
    <g fill="#5A9A38">
      <path d="M356 368l6 8 10-2-6 8 6 8-10-2-6 8-6-8-10 2 6-8-6-8 10 2z"/>
      <path d="M420 400l5 7 9-2-5 7 5 7-9-2-5 7-5-7-9 2 5-7-5-7 9 2z"/>
      <path d="M404 340l4 6 8-1-4 6 4 6-8-1-4 6-4-6-8 1 4-6-4-6 8 1z"/>
    </g>

    <!-- laranjas -->
    <g filter="url(#sombra-p)">
      <circle cx="456" cy="460" r="34" fill="url(#laranja)"/>
      <circle cx="300" cy="446" r="30" fill="url(#laranja)"/>
    </g>
    <g fill="#B85F10" opacity=".7"><circle cx="452" cy="454" r="3"/><circle cx="297" cy="441" r="3"/></g>

    <!-- pães (baguete diagonal e pão redondo) -->
    <g filter="url(#sombra-p)">
      <rect x="160" y="340" width="190" height="52" rx="26" fill="url(#pao)" transform="rotate(-38 255 366)"/>
      <circle cx="232" cy="426" r="44" fill="url(#pao)"/>
    </g>
    <g fill="none" stroke="#F5D4A0" stroke-width="5" stroke-linecap="round" opacity=".85">
      <path d="M210 410l16-14M240 386l16-14M270 362l16-14" transform="rotate(4 248 380)"/>
      <path d="M212 418c14 10 30 12 42 4M214 436c12 8 26 8 38 2"/>
    </g>

    <!-- cenouras -->
    <g filter="url(#sombra-p)"><path d="M290.1 223.3L404 282L301.9 204.7Z" fill="#EE7B2B" stroke="#EE7B2B" stroke-width="8" stroke-linejoin="round"/><path d="M325.5 239.1l3.5 -5.6M357.7 247.7l-2.9 4.7" stroke="#C85F16" stroke-width="2.4" stroke-linecap="round"/><path d="M296 214c-28.2 -24.2 -33 -51 -17.6 -57.6M296 214c-41.6 -15.600000000000001 -70.4 -14.399999999999999 -80.4 -18.4M296 214c-35.6 -21.6 -58.4 -40.4 -62.4 -50.4" fill="none" stroke="#5A9A38" stroke-width="5" stroke-linecap="round"/><path d="M279.4 244.8L388 312L292.6 227.2Z" fill="#EE7B2B" stroke="#EE7B2B" stroke-width="8" stroke-linejoin="round"/><path d="M313.3 263.2l3.9 -5.3M344.7 274.3l-3.3 4.4" stroke="#C85F16" stroke-width="2.4" stroke-linecap="round"/><path d="M286 236c-27.299999999999997 -25.4 -31.5 -53 -16.400000000000002 -59.2M286 236c-40.400000000000006 -17.200000000000003 -68.6 -16.8 -78.6 -20.8M286 236c-34.400000000000006 -23.200000000000003 -56.599999999999994 -42.8 -60.599999999999994 -52.8" fill="none" stroke="#5A9A38" stroke-width="5" stroke-linecap="round"/></g>
  </g>

  <!-- borda da caixa por cima (lábio) -->
  <rect x="168" y="168" width="304" height="304" rx="18" fill="none" stroke="#6A4520" stroke-width="3" opacity=".6"/>

  <!-- folha sobre a borda, à frente -->
  <path d="M486 420c34-6 66 12 78 38-30 12-66 4-82-22z" fill="#6FA544"/>
  <path d="M488 422c24 10 48 22 72 34" fill="none" stroke="#4C7A2A" stroke-width="2.4" stroke-linecap="round"/>
</svg>
