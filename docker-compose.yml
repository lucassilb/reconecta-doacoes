services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: reconecta_dev
      POSTGRES_USER: reconecta_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reconecta_dev -d reconecta_dev"]
      interval: 5s
      timeout: 3s
      retries: 15

  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql+psycopg://reconecta_dev:${POSTGRES_PASSWORD:-dev-only-change-me}@db:5432/reconecta_dev
      SECRET_KEY: ${SECRET_KEY:-dev-only-replace-this-secret-key}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      OLLAMA_URL: ${COMPOSE_OLLAMA_URL:-http://ollama:11434}
      OLLAMA_PERMITIR_DOCKER: "1"
      PORT: "5000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/reconecta/saude', timeout=4)"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    profiles: ["ia"]
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
  ollama_data:
